<!DOCTYPE html>

<html>

<head>

    <title>My Study Progress Dashboard</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            padding-bottom: 50px;
        }

        h1 {
            font-weight: bold;
        }

        p {
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="jumbotron jumbotron-fluid text-center bg-info text-warning">

            <h1 class="display-1">My Study Progress Dashboard</h1>

            <p class="lead">Track your learning milestones, manage subjects, and view real-time progress for your
                ongoing courses.</p>

        </div>

        <div class="row">

            <div class="col-12">

                <h2>Lessons Completed <span class="badge badge-dark">24</span></h2>

            </div>
        </div>

        <div class="row">

            <div class="col-6 my-5">

                <div>

                    <button class="btn btn-warning">Maths</button>

                    <span class="badge badge-warning m-5">10 Lessons</span>

                </div>

                <div class="progress">

                    <div class="progress-bar bg-warning text-dark" style="width: 100%;">

                        100%

                    </div>

                </div>

            </div>

            <div class="col-6 my-5">

                <div>

                    <div>

                        <button class="btn btn-success">Science</button>

                        <span class="badge badge-success m-5">6 Lessons</span>

                    </div>

                    <div class="progress">

                        <div class="progress-bar bg-success" style="width: 60%;">

                            60%

                        </div>

                    </div>

                </div>

            </div>

            <div class="col-6 my-5">

                <div>

                    <div>

                        <button class="btn btn-primary">English</button>

                        <span class="badge badge-primary m-5">2 Lessons</span>

                    </div>

                    <div class="progress">

                        <div class="progress-bar bg-primary" style="width: 20%;">

                            20%

                        </div>

                    </div>

                </div>

            </div>

            <div class="col-6 my-5">

                <div>

                    <div>

                        <button class="btn btn-danger">Coding</button>

                        <span class="badge badge-danger m-5">6 Lessons</span>

                    </div>

                    <div class="progress">

                        <div class="progress-bar bg-danger" style="width: 90%;">

                            90%

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div class="row">

            <div class="col-12">

                <h2>Subject Progress Overview <span class="badge badge-dark">90%</span></h2>

                <p class="m-3 text-warning">Maths</p>

                <div class="progress">

                    <div class="progress-bar bg-warning" style="width: 100%">

                        100%

                    </div>

                </div>

                <p class="m-3 text-success">Science</p>

                <div class="progress">

                    <div class="progress-bar bg-success" style="width: 90%">

                        90%

                    </div>

                </div>

                <p class="m-3 text-primary">English</p>

                <div class="progress">

                    <div class="progress-bar bg-primary" style="width: 80%">

                        80%

                    </div>

                </div>

                <p class="m-3 text-danger">Coding</p>

                <div class="progress">

                    <div class="progress-bar bg-danger" style="width: 90%">

                        90%

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

</body>

</html>
