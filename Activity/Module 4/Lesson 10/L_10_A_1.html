<!DOCTYPE html>
<html lang="en">

<head>
    <title>Beautiful Fitness Cards</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #1a202c;
            font-size: 2rem;
        }

        .card-container {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: auto;
            align-items: center;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            text-align: center;
            border-top: 5px solid #3498db;

        }

        .card:hover {
            transform: translateY(-5px);
        }

        .cardio {
            border-top-color: #ff4757;
        }

        .strength {
            border-top-color: #2ed573;
        }

        .yoga {
            border-top-color: #9b59b6;
        }

        .cooldown {
            border-top-color: #ffa502;
        }

        .card h2 {
            font-size: 1.2rem;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .duration {
            font-size: 0.85rem;
            color: #718096;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .card p {
            color: #4a5568;
            font-size: 0.9rem;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <h1>My Fitness Routine</h1>

    <div class="card-container">

        <div class="card cardio">
            <h2>Morning Cardio</h2>
            <div class="duration"> &#x23F1;30 mins</div>
            <p>Jogging and dynamic stretching.</p>
        </div>

        <div class="card strength">
            <h2>Strength</h2>
            <div class="duration">&#x23F1; 45 mins</div>
            <p>Push-ups, bodyweight squats, and planks.</p>
        </div>

        <div class="card yoga">
            <h2>Yoga</h2>
            <div class="duration">&#x23F1; 20 mins</div>
            <p>Breathing and spinal flexibility.</p>
        </div>

        <div class="card cooldown">
            <h2>Cool Down</h2>
            <div class="duration">&#x23F1; 15 mins</div>
            <p>Light walking and static stretches.</p>
        </div>

    </div>

</body>

</html>
